name: slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One run per branch: a new push supersedes the previous build for that ref,
  # so back-to-back merges to main only pay for the last one, and a PR push
  # never cancels main's build (or another PR's).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: make test
      - name: Build HTML and PDF
        run: |
          make slides
          make pdf
      - uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: dist/slides.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # Pages takes one deployment at a time; queue rather than cancel so an
      # in-flight deploy finishes instead of leaving the site half-published.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
