name: slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed per ref: a new push to a branch supersedes that branch's run, but
# runs on different branches never cancel each other. A constant group here
# meant any new run cancelled whatever was in flight, so pushing to several
# branches in quick succession left earlier PRs with cancelled builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: make test
      - name: Build HTML and PDF
        run: |
          make slides
          make pdf
      - uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: dist/slides.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Pages serializes deployments; never cancel one that is already running.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
